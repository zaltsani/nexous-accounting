name: ${COMPOSE_PROJECT_NAME:-nexous-accounting}

networks:
  nexous-network:
    driver: bridge
    name: nexous-network

volumes:
  postgres_data:
  redis_data:

services:
  # ----------------------------------------------------------------------------
  # INFRASTRUCTURES
  # ----------------------------------------------------------------------------
  nats:
    image: nats
    container_name: nats
    restart: always
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    command: ["-m", "8222"]
    networks:
      - nexous-network

  db:
    image: postgres:15-alpine
    container_name: nexous_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexous_accounting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexous_accounting}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexous-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexous-network
