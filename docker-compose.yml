name: ${COMPOSE_PROJECT_NAME:-nexous-accounting}

networks:
  nexous-network:
    name: nexous-network

services:
  # ----------------------------------------------------------------------------
  # APPS
  # ----------------------------------------------------------------------------
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-ghcr.io/zaltsani/nexous-accounting/api_gateway:latest}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=3000
    networks:
      - nexous-network

  web:
    image: ${WEB_IMAGE:-ghcr.io/zaltsani/nexous-accounting/web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: always
    ports:
      - "${WEB_PORT:-8000}:80"
    environment:
      - VITE_PUBLIC_BACKEND_URL=${VITE_PUBLIC_BACKEND_URL:-http://localhost:${API_PORT:-3000}}
      - VITE_MAINTENANCE_MODE=${VITE_MAINTENANCE_MODE:-false}
      - VITE_SITE_DOMAIN=${VITE_SITE_DOMAIN:-}
    depends_on:
      - api-gateway
    networks:
      - nexous-network

  # ----------------------------------------------------------------------------
  # SERVICES
  # ----------------------------------------------------------------------------
  service-core:
    image: ${SERVICES_CORE_IMAGE:-ghcr.io/zaltsani/nexous-accounting/services_core:latest}
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: services-core
    restart: always
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nexous_accounting}?schema=core
    networks:
      - nexous-network

  service-finops:
    image: ${SERVICES_FINOPS_IMAGE:-ghcr.io/zaltsani/nexous-accounting/services_finops:latest}
    build:
      context: .
      dockerfile: services/finops/Dockerfile
    container_name: services-finops
    restart: always
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nexous_accounting}?schema=finops
    networks:
      - nexous-network

  # ----------------------------------------------------------------------------
  # ERROR TRACKING
  # ----------------------------------------------------------------------------
  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USERNAME:-glitchtip}:${GLITCHTIP_DB_PASSWORD}@db:5432/nexous_accounting
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: super-secret-development-key
    networks:
      - nexous-network

  glitchtip:
    image: glitchtip/glitchtip
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USERNAME:-glitchtip}:${GLITCHTIP_DB_PASSWORD}@db:5432/nexous_accounting
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change_me_to_something_random} # best to run openssl rand -hex 32
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    networks:
      - nexous-network
