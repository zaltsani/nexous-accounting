name: ${COMPOSE_PROJECT_NAME:-nexous-accounting}

services:
  nats:
    image: nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    command: ["-m", "8222"]

