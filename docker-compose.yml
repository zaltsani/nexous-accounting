name: ${COMPOSE_PROJECT_NAME:-nexous-accounting}

services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-ghcr.io/zaltsani/nexous-accounting/api_gateway:latest}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=3000
    depends_on:
      nats:
        condition: service_started
    networks:
      - nexous-network
  


  web:
    image: ${WEB_IMAGE:-ghcr.io/zaltsani/nexous-accounting/web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: always
    ports:
      - "${WEB_PORT:-8000}:80"
    environment:
      - VITE_PUBLIC_BACKEND_URL=${VITE_PUBLIC_BACKEND_URL:-http://localhost:${API_PORT:-3000}}
      - VITE_MAINTENANCE_MODE=${VITE_MAINTENANCE_MODE:-false}
      - VITE_SITE_DOMAIN=${VITE_SITE_DOMAIN:-}
    depends_on:
      - api
    networks:
      - nexous-network

  service-core:
    image: ${SERVICES_CORE_IMAGE:-ghcr.io/zaltsani/nexous-accounting/services_core:latest}
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: services-core
    restart: always
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nexous_accounting}?schema=core
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - nexous-network

  nats:
    image: nats
    container_name: nats
    restart: always
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    command: ["-m", "8222"]
    networks:
      - nexous-network

  db:
    image: postgres:15-alpine
    container_name: nexous_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexous_accounting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexous_accounting}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexous-network

networks:
  nexous-network:
    driver: bridge

volumes:
  postgres_data:
